<style>

  input,textarea{caret-color:#9333ea;font-family:var(--font);}
  input:focus,textarea:focus{border-color:#6d28d9!important;outline:none;}
  button{cursor:pointer;font-family:var(--font);}

  .header{background:var(--surface);border-bottom:1px solid var(--border);padding:18px 26px;position:sticky;top:0;z-index:100;}
  .header-inner{max-width:950px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
  .system-title{color:var(--text);font-family:var(--display-font);font-size:22px;font-weight:400;}
  .system-sub{color:var(--muted);font-size:9px;letter-spacing:0.18em;text-transform:uppercase;margin-top:2px;opacity:0.6;}
  .header-btns{display:flex;gap:8px;align-items:center;}
  .main{max-width:950px;margin:0 auto;padding:28px 22px 0;}
  .btn-ghost{padding:7px 15px;background:transparent;border:1px solid var(--border);border-radius:7px;color:var(--muted);font-size:12px;}
  .btn-purple{padding:7px 15px;background:linear-gradient(135deg,#6d28d9,#9333ea);border:none;border-radius:7px;color:#fff;font-size:12px;font-weight:700;}
  .btn-edit{padding:7px 15px;border:1px solid var(--border);border-radius:7px;font-size:12px;background:transparent;color:var(--muted);}
  .btn-edit.active{background:rgba(147,51,234,0.15);color:#9333ea;font-weight:700;border-color:rgba(147,51,234,0.3);}
  .btn-icon{width:34px;height:34px;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:16px;display:flex;align-items:center;justify-content:center;padding:0;flex-shrink:0;}
  .btn-save{padding:8px 16px;background:linear-gradient(135deg,#065f46,#10b981);border:none;border-radius:8px;color:#fff;font-size:13px;font-weight:700;}
  .btn-cancel{padding:8px 14px;background:transparent;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:13px;}
  .btn-danger{position:absolute;top:8px;left:8px;background:#2a1a1a;border:1px solid #5a2020;border-radius:5px;color:#f87171;width:22px;height:22px;font-size:13px;display:flex;align-items:center;justify-content:center;padding:0;}

  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:13px;}

  .card-name{font-family:var(--display-font);font-size:18px;margin-bottom:3px;color:var(--text);}
  .card-pronouns{font-size:11px;margin-bottom:9px;font-weight:600;}
  .card-role{background:rgba(0,0,0,0.2);border-radius:7px;padding:3px 9px;display:inline-block;font-size:10px;color:var(--muted);}

  .avatar-lg{width:90px;height:90px;border-radius:50%;object-fit:cover;flex-shrink:0;display:block;border:2px solid var(--border);}
  .avatar-sm{width:64px;height:64px;border-radius:50%;object-fit:cover;margin:0 auto 10px;display:block;border:2px solid var(--border);}

  .fronting-chip-placeholder{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;}

  .field-empty{opacity:0.4;font-style:italic;color:var(--muted);}

  .font-option-name{font-size:13px;font-weight:700;color:var(--text);margin-bottom:2px;}
  .font-option-desc{font-size:11px;color:var(--muted);margin-bottom:6px;}
  .font-option-preview{font-size:14px;line-height:1.5;color:var(--text);opacity:0.85;}
  /* IO */
  .io-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:32px 36px;width:500px;max-width:95vw;max-height:90vh;overflow-y:auto;box-shadow:0 30px 90px rgba(0,0,0,0.7);}
  .io-btn{display:flex;align-items:center;gap:12px;padding:16px 20px;border-radius:12px;border:1px solid var(--border);background:var(--bg);cursor:pointer;width:100%;text-align:left;transition:border 0.15s;margin-bottom:10px;}
  .io-btn:hover{border-color:var(--muted);}
  .io-btn-icon{font-size:22px;flex-shrink:0;}
  .io-btn-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:2px;}
  .io-btn-desc{font-size:12px;color:var(--muted);}
  .io-warning{background:rgba(251,191,36,0.08);border:1px solid rgba(251,191,36,0.25);border-radius:10px;padding:12px 16px;margin:14px 0;font-size:12px;color:#fbbf24;line-height:1.6;}

  .add-form{background:var(--surface);border:1px solid var(--border);border-radius:22px;padding:26px 28px;margin-bottom:22px;}
  /* Loading */
  .loading-screen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;gap:16px;}
  .loading-spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:#9333ea;border-radius:50%;animation:spin 0.8s linear infinite;}

// ─── API ──────────────────────────────────────────────────────────────────────
const api={
  async req(method,path,body){
    const res=await fetch(`${SUPABASE_URL}/rest/v1/${path}`,{
      method,
      headers:{"apikey":SUPABASE_KEY,"Authorization":`Bearer ${SUPABASE_KEY}`,"Content-Type":"application/json","Prefer":method==="POST"?"resolution=merge-duplicates":""},
      body:body?JSON.stringify(body):undefined,
    });
    if(!res.ok){const t=await res.text();throw new Error(t);}
    if(res.status===204)return null;
    const text=await res.text();
    if(!text||text.trim()==='')return null;
    try{return JSON.parse(text);}catch{return null;}
  },
  get:(path)=>api.req("GET",path),
  post:(path,body)=>api.req("POST",path,body),
  delete:(path)=>api.req("DELETE",path),
};

// ─── Storage upload ───────────────────────────────────────────────────────────
async function uploadPhoto(file, alterId) {
  // Resize/compress to max 400px on longest side before uploading
  const compressed = await compressImage(file, 400);
  const ext = file.name.split('.').pop().toLowerCase() || 'jpg';
  const filename = `${alterId}-${Date.now()}.${ext}`;
  const res = await fetch(`${SUPABASE_URL}/storage/v1/object/photos/${filename}`, {
    method: 'POST',
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': `Bearer ${SUPABASE_KEY}`,
      'Content-Type': compressed.type,
      'x-upsert': 'true',
    },
    body: compressed,
  });
  if (!res.ok) { const t = await res.text(); throw new Error(t); }
  return `${SUPABASE_URL}/storage/v1/object/public/photos/${filename}`;
}

async function deletePhoto(url) {
  if (!url) return;
  const filename = url.split('/photos/').pop();
  if (!filename) return;
  await fetch(`${SUPABASE_URL}/storage/v1/object/photos/${filename}`, {
    method: 'DELETE',
    headers: {'apikey': SUPABASE_KEY, 'Authorization': `Bearer ${SUPABASE_KEY}`},
  }).catch(()=>{});
}

function compressImage(file, maxPx) {
  return new Promise((resolve) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let {width: w, height: h} = img;
      if (w > maxPx || h > maxPx) {
        if (w > h) { h = Math.round(h * maxPx / w); w = maxPx; }
        else { w = Math.round(w * maxPx / h); h = maxPx; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      canvas.toBlob(blob => resolve(blob), 'image/jpeg', 0.82);
    };
    img.src = url;
  });
}

  clearTimeout(syncBadgeTimer);
  if(status==='saved') syncBadgeTimer=setTimeout(()=>{badge.style.opacity='0';},2500);
}

async function dbLoad(){
  const [altersRows,notesRows,metaRows]=await Promise.all([
    api.get('alters?select=data&order=data->>name'),
    api.get('notes?select=data&order=data->>ts'),
    api.get('system_meta?select=key,value'),
  ]);
  state.alters=(altersRows||[]).map(r=>r.data);
  state.notes=(notesRows||[]).map(r=>r.data);
  const nameMeta=(metaRows||[]).find(r=>r.key==='systemName');

  if(state.alters.length===0){state.alters=[DEMO_ALTER];await dbSaveAlters();}
}

// ─── DOM helper ───────────────────────────────────────────────────────────────
function h(tag,attrs,...children){
  const el=document.createElement(tag);
  if(attrs) Object.entries(attrs).forEach(([k,v])=>{
    if(k==='style'&&typeof v==='object') Object.assign(el.style,v);
    else if(k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==='className') el.className=v;
    else el.setAttribute(k,v);
  });
  children.flat(Infinity).forEach(c=>{
    if(c==null||c===false)return;
    el.appendChild(typeof c==='string'?document.createTextNode(c):c);
  });
  return el;
}

function renderAvatarEditor(draft, color, onUpdate) {
  let uploading = false;

  function build() {
    const avatarEl = renderAvatar(draft.photo, color, 'lg');
    avatarEl.style.filter = `drop-shadow(0 0 14px ${color}66)`;

    const uploadBtn = h('button', {className:'avatar-upload-btn', onClick: () => {
      const input = document.createElement('input');
      input.type='file'; input.accept='image/*';
      input.onchange = async e => {
        const file = e.target.files[0]; if(!file) return;
        uploading = true; rebuildWidget();
        try {
          const url = await uploadPhoto(file, draft.id);
          if (draft.photo) await deletePhoto(draft.photo);
          draft.photo = url;
          onUpdate(url);
        } catch(err) {
          alert('Photo upload failed: ' + err.message);
        }
        uploading = false; rebuildWidget();
      };

    }}, [uploading ? '⏳ Uploading…' : '📷 Upload photo']);

// ─── IO panel ────────────────────────────────────────────────────────────────
function renderIOPanel(){
  function doExport(){
    const data={version:1,exported:new Date().toISOString(),systemName:state.systemName,alters:state.alters,notes:state.notes};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;
    a.download=`${state.systemName.replace(/\s+/g,'-').toLowerCase()}-backup-${new Date().toISOString().slice(0,10)}.json`;
    a.click();URL.revokeObjectURL(url);
  }
  async function doImport(){
    const input=document.createElement('input');input.type='file';input.accept='.json';
    input.onchange=async e=>{
      const file=e.target.files[0];if(!file)return;
      const reader=new FileReader();
      reader.onload=async ev=>{
        try{
          const data=JSON.parse(ev.target.result);
          if(!data.alters||!Array.isArray(data.alters)){alert("This doesn't look like a valid backup.");return;}
          const ok=confirm(`Replace all current data with backup from ${data.exported?new Date(data.exported).toLocaleDateString():'unknown date'}?\n${data.alters.length} alter(s), ${(data.notes||[]).length} note(s).\n\nThis cannot be undone.`);
          if(!ok)return;
          showSync('saving','Importing…');
          await api.delete('alters?id=neq.___none___');
          await api.delete('notes?id=neq.___none___');
          if(data.systemName)state.systemName=data.systemName;
          state.alters=data.alters;state.notes=data.notes||[];
          await dbSaveAlters();
          for(const n of state.notes)await dbSaveNote(n);
          state.selected=null;overlayEl.remove();render();
        }catch(e){alert('Could not read that file.');}
      };
      reader.readAsText(file);
    };
    input.click();
  }
  const box=h('div',{className:'io-box'},[
    h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'8px'}},[
      h('h3',{style:{color:'var(--text)',fontFamily:'var(--display-font)',fontSize:'22px'}},['💾 Import / Export']),
      h('button',{style:{background:'transparent',border:'none',color:'var(--muted)',fontSize:'22px',lineHeight:'1',padding:'0',cursor:'pointer'},onClick:()=>overlayEl.remove()},['×']),
    ]),
    h('p',{style:{color:'var(--muted)',fontSize:'12px',lineHeight:'1.65',marginBottom:'24px'}},
      ['Your data is stored in the shared database. Export makes a local backup you can keep safe.']),
    h('button',{className:'io-btn',onClick:doExport},[
      h('span',{className:'io-btn-icon'},['📤']),
      h('div',{},[h('div',{className:'io-btn-title'},['Export backup']),h('div',{className:'io-btn-desc'},['Download all alters & notes as a .json file'])]),
    ]),
    h('button',{className:'io-btn',onClick:doImport},[
      h('span',{className:'io-btn-icon'},['📥']),
      h('div',{},[h('div',{className:'io-btn-title'},['Import backup (replace)']),h('div',{className:'io-btn-desc'},['Load a backup file — replaces everything in the database'])]),
    ]),
    h('div',{className:'io-warning'},['⚠ Backup files contain all profile data including sensitive fields. Store them somewhere safe and private.']),
  ]);
  const overlayEl=h('div',{className:'modal-overlay',style:{zIndex:'9997'}},[box]);
  return overlayEl;
}

          renderToggle(draft.isFronting,v=>{draft.isFronting=v;rebuildProfile();},c),
        ])
      :(alter.isFronting?h('span',{className:'fronting-tag',style:{background:c}},['FRONTING']):h('span',{},[]));
    const colorPickerEl=editing?h('div',{style:{marginTop:'14px'}},[
      h('p',{style:{color:'var(--muted)',fontSize:'9px',fontWeight:'700',letterSpacing:'0.14em',textTransform:'uppercase',marginBottom:'7px'}},['Accent color']),
      h('div',{className:'palette',id:'hero-palette'},PALETTE.map(col=>{
        const dot=h('div',{className:'palette-dot',style:{background:col,borderColor:draft.color===col?'#fff':'transparent'},onClick:()=>{
          draft.color=col;document.querySelectorAll('#hero-palette .palette-dot').forEach((d,i)=>d.style.borderColor=PALETTE[i]===col?'#fff':'transparent');
        }});return dot;
      })),
    ]):null;

    const actionsEl=state.editMode
      ?(!editing
          ?h('div',{className:'hero-actions'},[
              h('button',{style:{padding:'8px 18px',background:`linear-gradient(135deg,${c}bb,${c})`,border:'none',borderRadius:'8px',color:'#fff',fontSize:'13px',fontWeight:'700'},onClick:()=>{editing=true;rebuildProfile();}},['Edit']),
            ])
          :h('div',{className:'hero-actions'},[
              h('button',{className:'btn-save',onClick:async()=>{
                state.alters=state.alters.map(a=>a.id===draft.id?{...draft}:a);
                state.selected={...draft};alter={...draft};editing=false;rebuildProfile();
                await dbSaveAlters();
              }},['Save']),
              h('button',{className:'btn-cancel',onClick:()=>{draft={...alter};editing=false;rebuildProfile();}},['Cancel']),
            ])
        )
      :null;

    const heroGlow=h('div',{style:{position:'absolute',inset:'0',background:`radial-gradient(ellipse at 72% 18%, ${c}18 0%, transparent 62%)`,pointerEvents:'none'}});
    const hero=h('div',{className:'profile-hero',style:{border:`1px solid ${c}44`}},[
      heroGlow,
      h('div',{className:'hero-row'},[
        avatarSection,
        h('div',{className:'hero-meta'},[nameEl,pronounsEl,statusEl,colorPickerEl]),
        actionsEl,
      ]),
    ]);

    const profileNotes=state.notes.filter(n=>n.alterId===alter.id);
    const authorInput=h('input',{className:'field-input',placeholder:'Your name (optional)',style:{marginBottom:'9px'},onInput:e=>noteAuthor=e.target.value});
    const textInput=h('textarea',{className:'field-textarea',placeholder:`Write something for ${alter.name}…`,style:{marginBottom:'11px'},onInput:e=>noteText=e.target.value});
    const notesSection=h('div',{className:'notes-section'},[
      renderSectionHeader(`Leave a note for ${alter.name}`,c),
      authorInput,textInput,
      h('button',{style:{padding:'9px 20px',background:`linear-gradient(135deg,${c}bb,${c})`,border:'none',borderRadius:'8px',color:'#fff',fontSize:'13px',fontWeight:'700'},onClick:async()=>{
        if(!textInput.value.trim())return;
        const note={id:uid(),alterId:alter.id,author:authorInput.value.trim()||'Anonymous',text:textInput.value.trim(),ts:Date.now()};
        state.notes.push(note);rebuildProfile();await dbSaveNote(note);
      }},['Leave note ✉️']),
      profileNotes.length>0?h('div',{style:{marginTop:'22px'}},[
        h('p',{style:{color:'var(--muted)',fontSize:'9px',fontWeight:'700',letterSpacing:'0.14em',textTransform:'uppercase',marginBottom:'12px'}},['Notes from friends']),
        h('div',{style:{display:'flex',flexDirection:'column',gap:'9px'}},
          [...profileNotes].reverse().map(n=>
            h('div',{className:'note-item',style:{borderLeft:`3px solid ${c}`}},[
              h('div',{style:{display:'flex',justifyContent:'space-between',marginBottom:'4px'}},[
                h('span',{className:'note-author',style:{color:c}},[n.author]),
                h('span',{className:'note-date'},[new Date(n.ts).toLocaleDateString()]),
              ]),
              h('p',{className:'note-text'},[n.text]),
            ])
          )
        ),
      ]):null,
    ]);

    const kinkSection=h('div',{className:'collapsible',style:{border:'1px solid #f472b625',marginBottom:'8px'}},[
      h('button',{className:'collapsible-btn'+(state.kinkVisible?' open':''),style:{border:'none'},onClick:()=>{state.kinkVisible=!state.kinkVisible;rebuildProfile();}},[
        h('span',{className:'collapsible-label',style:{color:'#f472b6'}},['🔞 Kinks']),
        h('span',{className:'collapsible-arrow'+(state.kinkVisible?' open':''),style:{color:'#f472b6'}},['▾']),
      ]),
      state.kinkVisible?h('div',{className:'collapsible-content'},[field('Kinks','kinks',true)]):null,
    ]);

    return h('div',{style:{maxWidth:'700px',margin:'0 auto'}},[
      h('button',{className:'profile-back',onClick:()=>{state.selected=null;render();}},['← Back to gallery']),
      hero,
      h('div',{className:'profile-main'},[
        renderSectionHeader('Identity',c),
        h('div',{className:'two-col'},[field('Role','role',false,'e.g. Protector, Little, Host…'),field('Age (if different)','age',false,'e.g. 8, teen, timeless…')]),
        field('What that role means for us','roleDescription',true),
        field('Preferred labels','preferredLabels',false,'e.g. alter, part, little…'),
        renderSectionHeader('Appearance & Aesthetic',c),
        field('Innerworld appearance / style / aesthetic','appearance',true),
        renderSectionHeader('Tastes & Interests',c),
        field('Favorite playlist / genres / artists','music',true),
        field('Favorite movies / shows / genres','mediaFaves',true),
        field('Hobbies / interests / desired skills','hobbies',true),
        field('Other notable likes','otherLikes',true),
        renderSectionHeader('Within the System',c),
        field("Specific skills / what they're best at",'systemSkills',true),
        renderSectionHeader('Personality',c),
        field('Mannerisms / identifiers / level of masking','mannerisms',true),
        field('Internal traits','internalTraits',true),
        field('Emotional regulation / empathy level / expression','emotionalReg',true),
        field('Love languages (in order)','loveLanguages',true,'1. …  2. …  3. …'),
        renderSectionHeader('Free Space',c),
        field('Fun facts / free space','freeSpace',true),
      ]),
      renderCollapsible('⚠ Personal problems / warnings','#f87171',state.editMode,()=>field('Personal problems / warnings','personalProblems',true),'problems'),
      renderCollapsible('⚡ Possible triggers','#fbbf24',state.editMode,()=>field('Possible triggers','triggers',true),'triggers'),
      renderCollapsible('— Dislikes / boundaries / pet-peeves','#94a3b8',state.editMode,()=>field('Dislikes / boundaries / pet-peeves','dislikes',true),'dislikes'),
      renderCollapsible('🌿 Substances','#34d399',state.editMode,()=>field('Substances','substances',true,'e.g. caffeine fine, alcohol complicated…'),'substances'),
      kinkSection,
      notesSection,
    ]);
  }

  let profileEl=buildProfile();
  function rebuildProfile(){const n=buildProfile();if(profileEl.parentNode)profileEl.parentNode.replaceChild(n,profileEl);profileEl=n;}
  return profileEl;
}

// ─── Gallery ──────────────────────────────────────────────────────────────────
function renderGallery(){
  const fronting=state.alters.filter(a=>a.isFronting);
  const frontingBanner=fronting.length>0
    ?h('div',{className:'fronting-banner'},[
        h('div',{style:{display:'flex',alignItems:'center',gap:'6px',flexShrink:'0'}},[h('div',{className:'fronting-dot'}),h('span',{className:'fronting-label'},['Currently fronting'])]),
        h('div',{style:{display:'flex',gap:'7px',flexWrap:'wrap'}},fronting.map(a=>{
          const chipAvatar = a.photo
            ? h('img',{className:'fronting-chip-avatar',src:a.photo,alt:''})
            : (() => { const d=h('div',{className:'fronting-chip-placeholder',style:{background:`${a.color}33`,color:a.color}}); d.innerHTML=silhouetteSVG('sm'); return d; })();
          return h('span',{className:'fronting-chip',style:{borderColor:`${a.color}30`,color:a.color},onClick:()=>{state.selected=a;state.kinkVisible=false;state.openSections={};render();}},[chipAvatar,a.name]);
        })),
      ])
    :null;
  const gallery=state.alters.length===0
    ?h('div',{style:{textAlign:'center',padding:'80px 20px'}},[h('p',{style:{color:'var(--muted)',fontSize:'14px',opacity:'0.6'}},['No alters yet — enter Edit Mode to add your system members.'])])
    :h('div',{className:'gallery'},state.alters.map(renderAlterCard));
  return h('div',{},[frontingBanner,state.showAddForm&&state.editMode?renderAddForm():null,gallery]);
}

// ─── Header ───────────────────────────────────────────────────────────────────
function renderHeader(){
  let nameDisplay;
  if(state.editMode&&state.editingName){
    const inp=h('input',{style:{background:'transparent',border:'none',borderBottom:'2px solid #9333ea',color:'var(--text)',fontSize:'21px',fontFamily:'var(--display-font)',padding:'0 0 2px',outline:'none',minWidth:'180px'},value:state.systemName,onInput:e=>{state.systemName=e.target.value;},onKeydown:e=>{if(e.key==='Enter'){state.editingName=false;scheduleSave();render();}}});
    nameDisplay=h('div',{style:{display:'flex',gap:'8px',alignItems:'center'}},[inp,h('button',{style:{background:'#6d28d9',border:'none',borderRadius:'5px',color:'#fff',cursor:'pointer',padding:'4px 11px',fontSize:'11px',fontWeight:'700'},onClick:()=>{state.editingName=false;scheduleSave();render();}},['Save'])]);
    setTimeout(()=>inp.focus(),30);
  }else{
    nameDisplay=h('h1',{className:'system-title',style:{cursor:state.editMode?'pointer':'default'},onClick:()=>{if(state.editMode){state.editingName=true;render();}}},[state.systemName,state.editMode?h('span',{style:{fontSize:'12px',color:'var(--muted)',marginLeft:'7px',opacity:'0.5'}},['✏️']):null]);
  }
  const settingsBtn=h('button',{className:'btn-icon',title:'Appearance settings',onClick:()=>document.body.appendChild(renderSettingsPanel())},['⚙']);
  const ioBtn=state.editMode?h('button',{className:'btn-icon',title:'Import / Export',style:{fontSize:'14px'},onClick:()=>document.body.appendChild(renderIOPanel())},['💾']):null;
  const addBtn=state.editMode&&!state.selected?h('button',{className:'btn-purple',onClick:()=>{state.showAddForm=true;render();}},['+ Add Alter']):null;
  const editBtn=h('button',{className:'btn-edit'+(state.editMode?' active':''),onClick:()=>{
    if(state.editMode){state.editMode=false;render();}
    else{const modal=renderPasswordModal(()=>{state.editMode=true;modal.remove();render();},()=>modal.remove());document.body.appendChild(modal);}
  }},[state.editMode?'Exit Edit Mode':'Edit Mode']);
  return h('div',{className:'header'},[
    h('div',{className:'header-inner'},[
      h('div',{},[nameDisplay,h('p',{className:'system-sub'},['System Profiles'])]),
      h('div',{className:'header-btns'},[settingsBtn,ioBtn,addBtn,editBtn]),
    ])
  ]);
}

// ─── Render & Init ────────────────────────────────────────────────────────────
function render(){
  applyTheme(state.settings);
  const app=document.getElementById('app');
  app.innerHTML='';
  app.appendChild(renderHeader());
  app.appendChild(h('div',{className:'main'},[state.selected?renderProfile(state.selected):renderGallery()]));
}

applyTheme(state.settings);
showLoading();
dbLoad().then(()=>{
  state.loading=false;hideLoading();render();
}).catch(err=>{
  hideLoading();
  document.getElementById('app').innerHTML=`<div style="text-align:center;padding:80px 20px;color:var(--muted);font-family:var(--font)"><p style="font-size:18px;margin-bottom:10px">⚠ Could not connect to database</p><p style="font-size:13px;opacity:0.7">${err.message}</p></div>`;
});
</script>
</body>
</html>
